apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-metrics-demo
  namespace: nginx-metrics
  labels:
    app: &app nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: *app
  template:
    metadata:
      labels:
        app: *app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: nginx
        image: bitnami/nginx:latest
        ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 20Mi
        limits:
          cpu: 100m
          memory: 100Mi